<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>migaku2 settings</title>
    <style>
      body {
        font-family: "Roboto", system-ui, sans-serif;
        max-width: 560px;
        margin: 32px auto;
        padding: 0 16px;
        color: #222;
        background: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #eee; background: #1c1c1c; }
        input, select { background: #2a2a2a; color: #eee; border-color: #555; }
      }
      h1 { font-size: 20px; }
      h2 { font-size: 14px; margin: 24px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; }
      label { display: block; margin: 10px 0 4px; font-size: 13px; font-weight: 500; }
      .hint { font-size: 12px; opacity: 0.65; margin-top: 2px; }
      input { width: 100%; box-sizing: border-box; font: inherit; padding: 7px 9px; border: 1px solid #bbb; border-radius: 6px; }
      .row { display: flex; gap: 12px; }
      .row > div { flex: 1; }
      button {
        margin-top: 20px; font: inherit; font-weight: 500; padding: 9px 22px;
        border: none; border-radius: 6px; background: #3ea6ff; color: #fff; cursor: pointer;
      }
      button.secondary { background: transparent; color: #3ea6ff; }
      #status { display: inline-block; margin-left: 12px; font-size: 13px; }
      #status.ok { color: #2e9e5b; }
      #status.error { color: #d33; }
    </style>
  </head>
  <body>
    <h1>migaku2 settings</h1>

    <h2>Audio</h2>
    <div class="row">
      <div>
        <label for="padStartMs">Padding before line (ms)</label>
        <input id="padStartMs" type="number" min="0" max="5000" step="50" />
      </div>
      <div>
        <label for="padEndMs">Padding after line (ms)</label>
        <input id="padEndMs" type="number" min="0" max="5000" step="50" />
      </div>
    </div>

    <h2>Anki</h2>
    <label for="ankiUrl">AnkiConnect URL</label>
    <input id="ankiUrl" type="text" />
    <label for="noteTypes">Note types for “update last card” (comma-separated)</label>
    <input id="noteTypes" type="text" list="modelList" />
    <div class="hint">The ＋ button updates the newest note of one of these types.</div>
    <label for="basicDeck">Deck for quick Basic cards (Alt+click ＋)</label>
    <input id="basicDeck" type="text" list="deckList" />
    <label for="basicModel">Note type for quick cards</label>
    <input id="basicModel" type="text" list="modelList" />
    <datalist id="deckList"></datalist>
    <datalist id="modelList"></datalist>

    <h2>Hotkeys (Alt + letter)</h2>
    <div class="row">
      <div>
        <label for="sidebarKey">Toggle sidebar</label>
        <input id="sidebarKey" type="text" maxlength="1" />
      </div>
      <div>
        <label for="overlayKey">Toggle overlay</label>
        <input id="overlayKey" type="text" maxlength="1" />
      </div>
    </div>

    <h2>Screenshot</h2>
    <div class="row">
      <div>
        <label for="imageMaxWidth">Max width (px)</label>
        <input id="imageMaxWidth" type="number" min="320" max="3840" step="10" />
      </div>
      <div>
        <label for="jpegQuality">JPEG quality (0.1–1)</label>
        <input id="jpegQuality" type="number" min="0.1" max="1" step="0.05" />
      </div>
    </div>

    <button id="save">Save</button>
    <button id="test" class="secondary">Test AnkiConnect</button>
    <span id="status"></span>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
